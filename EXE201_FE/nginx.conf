server {
    listen 80;
    server_name gundam.thanhnt-tech.id.vn;

    root /usr/share/nginx/html;
    index index.html;

    location ~* \.(js|css|json|ico|svg|jpg|jpeg|png|woff2?|ttf|eot)$ {
        try_files $uri =404;
        access_log off;
        expires 6M;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri /index.html;
    }

    gzip on;
    gzip_types text/plain application/javascript text/javascript application/json text/css;
    gzip_min_length 1000;
}
